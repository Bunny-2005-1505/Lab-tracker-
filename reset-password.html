<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Set New Password - LabTracker</title>
<script src="supabaseClient.js"></script>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 0; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; background: #f0f2f5; background-image: url("chemistry-lab-illustrated-background_52683-68249.jpg"); background-size: cover; background-position: center; background-attachment: fixed; }
#box { background: rgba(255,255,255,0.8); padding: 30px; border-radius: 8px; box-shadow: 0 0 12px #fffcfc; width: 100%; max-width: 360px; }
h2 { text-align: center; font-size: 28px; margin: 0 0 10px; }
p.hint { font-size: 14px; color: #333; text-align: center; margin: 0 0 8px; }
input { width: 100%; margin: 10px 0; padding: 12px 14px; font-size: 16px; border-radius: 25px; border: 1px solid #bbb; }
button { display: block; width: 70%; min-width: 140px; background: teal; border: none; color: white; font-size: 16px; padding: 12px; cursor: pointer; border-radius: 25px; margin: 16px auto 0; }
button:disabled { opacity: .6; cursor: default; }
button:hover:not(:disabled) { background: #007770; }
.message { min-height: 20px; text-align: center; margin-top: 10px; font-size: 14px; }
p.links { text-align: center; margin: 14px 0 0; }
.logo { height: 70px; position: absolute; right: 5%; top: 14px; }
#form { display: none; }
@media (max-width: 600px) { body { justify-content: flex-start; padding-top: 90px; } .logo { height: 48px; right: 12px; top: 12px; } #box { padding: 22px 18px; } }
</style>
</head>
<body>
<img class="logo" src="logo.png" alt="Lab Tracker logo">
<div id="box">
  <h2>Set new password</h2>
  <p id="status" class="hint">Checking your reset link...</p>
  <form id="form">
    <input id="pw1" type="password" placeholder="New password (min 8 characters)" required minlength="8" autocomplete="new-password">
    <input id="pw2" type="password" placeholder="Confirm new password" required minlength="8" autocomplete="new-password">
    <button type="submit" id="go">Update password</button>
  </form>
  <div id="msg" class="message"></div>
  <p class="links"><a href="login.html">Back to login</a> · <a href="forgot-password.html">Request a new link</a></p>
</div>

<script>
const statusEl = document.getElementById('status');
const form = document.getElementById('form');
const msg = document.getElementById('msg');
const go = document.getElementById('go');
let ready = false;

function showForm() {
  if (ready) return;
  ready = true;
  statusEl.textContent = 'Choose a new password for your account.';
  form.style.display = 'block';
}

supabase.auth.onAuthStateChange((event, session) => {
  if ((event === 'PASSWORD_RECOVERY' || event === 'SIGNED_IN') && session) showForm();
});

(async () => {
  // Give the library a moment to read the link in the address bar
  await new Promise(r => setTimeout(r, 1200));
  if (ready) return;
  const { data } = await supabase.auth.getSession();
  if (data && data.session) showForm();
  else {
    statusEl.style.color = 'red';
    statusEl.textContent = 'This reset link is invalid or has expired. Please request a new one.';
  }
})();

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const p1 = document.getElementById('pw1').value;
  const p2 = document.getElementById('pw2').value;
  msg.style.color = 'red';
  if (p1.length < 8) { msg.textContent = 'Password must be at least 8 characters.'; return; }
  if (p1 !== p2) { msg.textContent = 'The two passwords do not match.'; return; }
  go.disabled = true;
  msg.style.color = '#333';
  msg.textContent = 'Updating...';
  const { error } = await supabase.auth.updateUser({ password: p1 });
  if (error) {
    msg.style.color = 'red';
    msg.textContent = error.message;
    go.disabled = false;
    return;
  }
  msg.style.color = 'green';
  msg.textContent = 'Password updated! Redirecting to login...';
  await supabase.auth.signOut();
  setTimeout(() => { location.href = 'login.html'; }, 1800);
});
</script>
</body>
</html>
