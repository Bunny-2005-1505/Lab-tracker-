<!DOCTYPE html>
<html>
<head>
  <title>Products - LabTracker</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="supabaseClient.js"></script>
  <style>
    body { font-family: Arial;width: 92vw;height: 100vh; margin: auto; padding: 20px;background-image: url("download.jpg");background-size: cover;backdrop-filter: blur(5px); }
    table { width: 100%; border-collapse: collapse; }
    th, td { border: 1px solid #bbb; padding: 8px; text-align: left; }
    th { background-color: teal; color: white; }
    button { background-color: #c0392b; border:none; color: white; padding: 6px 10px; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #e74c3c; }
    img{
    height: 70px;
    margin-right: 5%;
    vertical-align: middle;
    position: absolute;
    right: 0%;
    top: 0%;
  }
  </style>
</head>
<body>

<h2>Products</h2>
<img src="logo.png" alt="">
<table>
  <thead>
    <tr>
      <th>Lab</th><th>QR Code</th><th>Name</th><th>Description</th><th>Quantity</th><th>Expiry Date</th><th>Delete</th>
    </tr>
  </thead>
  <tbody id="tableBody" style="color: white;"></tbody>
</table>

<button onclick="location.href='dashboard.html'">Back to Dashboard</button>

<script>
  let currentUser = null;
  const tbody = document.getElementById('tableBody');

  async function loadProducts() {
    const { data, error } = await supabase
      .from('products')
      .select('*')
      .order('created_at', { ascending: false });

    if (error) {
      alert('Error loading products: ' + error.message);
      return;
    }
    render(data);
  }

  function render(products) {
    tbody.innerHTML = '';
    products.forEach((p) => {
      const tr = document.createElement('tr');
      const canDelete = currentUser && p.user_id === currentUser.id;
      tr.innerHTML = `
        <td>${p.lab}</td>
        <td>${p.qr_code || ''}</td>
        <td>${p.name}</td>
        <td>${p.description || ''}</td>
        <td>${p.quantity}</td>
        <td>${p.expiry_date}</td>
        <td>${canDelete ? `<button data-id="${p.id}">Delete</button>` : ''}</td>
      `;
      if (canDelete) {
        tr.querySelector('button').addEventListener('click', async () => {
          const { error } = await supabase.from('products').delete().eq('id', p.id);
          if (error) {
            alert('Error deleting: ' + error.message);
            return;
          }
          alert('Product deleted.');
          loadProducts();
        });
      }
      tbody.appendChild(tr);
    });
  }

  (async () => {
    const { data: { user } } = await supabase.auth.getUser();
    if (!user) {
      location.href = 'login.html';
      return;
    }
    currentUser = user;
    loadProducts();
  })();
</script>

</body>
</html>
