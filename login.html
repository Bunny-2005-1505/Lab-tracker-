<!DOCTYPE html>
<html>
<head>
  <title>Login - LabTracker</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; background-image: url("chemistry-lab-illustrated-background_52683-68249.jpg"); background-size: cover; flex-direction: column; }
    form { background: rgba(255, 255, 255, 0.448); padding: 30px; border-radius: 8px; box-shadow: 0 0 12px #fffcfc; width: 300px; margin-bottom: 15px; }
    h2 { width: 100%; text-align: center; font-size: 30px }
    input { width: 100%; margin: 10px 0; padding: 10px; border-radius: 25px; }
    button { width: 50%; background: teal; border: none; color: white; font-size: 16px; padding: 10px; cursor: pointer; border-radius: 25px; margin-left: 25%; margin-top: 10%; }
    button:hover { background: #007770; }
    p{width: 100%; text-align: center; }
    .message { color: red; height: 20px; }
    .contact { background: rgba(255,255,255,0.65); box-shadow: 0 0 12px #d0d0d0; border-radius: 8px; padding: 15px 10px; width: 300px; text-align: center; font-size: 17px; margin-top: 5px;}
    .logo {
  height:20px;
  margin-right: 15px;
  vertical-align: middle;
    }
    header {
  display: flex;
  align-items: center;
  justify-content: center;
  /* ...rest of header styles... */
    }
  img{
    height: 70px;
    margin-right: 5%;
    vertical-align: middle;
    position: absolute;
    right: 0%;
    top: 5%;
  }
  </style>
</head>
<body>
  <img src="logo.png" alt="">
  <form id="loginForm">
    <h2>Login</h2>
    <input id="username" placeholder="Username" required />
    <input id="password" type="password" placeholder="Password" required />
    <button type="submit">Login</button>
    <div id="msg" class="message"></div>
    <p>New user? <a href="register.html">Register here</a></p>
  </form>

  <div class="contact">
    <strong>Contact Us:</strong><br>
    Phone: +91 9177843853<br>
    Email: hemanth.23bce9034@vitapstudent.ac.in
  </div>

  <script>
    const dummyUsers = JSON.parse(localStorage.getItem('users') || '[]');

    document.getElementById('loginForm').onsubmit = e => {
      e.preventDefault();
      const username = e.target.username.value.trim();
      const password = e.target.password.value.trim();

      const user = dummyUsers.find(u => u.username === username && u.password === password);
      if (user) {
        localStorage.setItem('loggedInUser', username);
        window.location.href = 'dashboard.html';
      } else {
        document.getElementById('msg').textContent = 'Invalid username or password';
      }
    };
  </script>
</body>
</html>
