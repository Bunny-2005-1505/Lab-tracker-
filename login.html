<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Login - LabTracker</title>
  <script src="supabaseClient.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; background: #f0f2f5; background-image: url("chemistry-lab-illustrated-background_52683-68249.jpg"); background-size: cover; background-position: center; background-attachment: fixed; }
    #loginForm { background: rgba(255, 255, 255, 0.55); padding: 30px; border-radius: 8px; box-shadow: 0 0 12px #fffcfc; width: 100%; max-width: 340px; margin-bottom: 15px; }
    h2 { width: 100%; text-align: center; font-size: 30px; margin: 0 0 10px; }
    #loginForm input { width: 100%; margin: 10px 0; padding: 12px 14px; font-size: 16px; border-radius: 25px; border: 1px solid #bbb; }
    #loginForm button { display: block; width: 50%; min-width: 120px; background: teal; border: none; color: white; font-size: 16px; padding: 12px; cursor: pointer; border-radius: 25px; margin: 20px auto 0; }
    #loginForm button:hover { background: #007770; }
    p { width: 100%; text-align: center; }
    .message { color: red; min-height: 20px; text-align: center; margin-top: 8px; }
    .contact { background: rgba(255,255,255,0.7); box-shadow: 0 0 12px #d0d0d0; border-radius: 8px; padding: 15px 10px; width: 100%; max-width: 340px; text-align: center; font-size: 16px; margin-top: 5px; overflow-wrap: anywhere; }
    .logo { height: 70px; position: absolute; right: 5%; top: 14px; }

    @media (max-width: 600px) {
      body { justify-content: flex-start; padding-top: 90px; padding-bottom: 90px; }
      .logo { height: 48px; right: 12px; top: 12px; }
      #loginForm { padding: 22px 18px; }
      h2 { font-size: 26px; }
      .contact { font-size: 15px; }
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="LabTracker logo">
  <form id="loginForm">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email" required />
    <input id="password" type="password" placeholder="Password" required />
    <button type="submit">Login</button>
    <div id="msg" class="message"></div>
    <p>New user? <a href="register.html">Register here</a></p>
  </form>

  <div class="contact">
    <strong>Contact Us:</strong><br>
    Phone: +91 9177843853<br>
    Email: hemanth.23bce9034@vitapstudent.ac.in
  </div>

  <script>
    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim();
      const password = e.target.password.value.trim();
      const msg = document.getElementById('msg');
      msg.textContent = 'Working...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          msg.textContent = error.message;
          return;
        }

        window.location.href = 'dashboard.html';
      } catch (err) {
        msg.textContent = 'Unexpected error: ' + err.message;
      }
    };
  </script>
  <script src="chatbot.js"></script>
</body>
</html>
