<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Login - LabTracker</title>
  <script src="supabaseClient.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; background: #f0f2f5; background-image: url("chemistry-lab-illustrated-background_52683-68249.jpg"); background-size: cover; background-position: center; background-attachment: fixed; }
    #loginForm { background: rgba(255, 255, 255, 0.55); padding: 30px; border-radius: 8px; box-shadow: 0 0 12px #fffcfc; width: 100%; max-width: 340px; margin-bottom: 15px; }
    h2 { width: 100%; text-align: center; font-size: 30px; margin: 0 0 10px; }
    #loginForm input { width: 100%; margin: 10px 0; padding: 12px 14px; font-size: 16px; border-radius: 25px; border: 1px solid #bbb; }
    #loginForm button { display: block; width: 50%; min-width: 120px; background: teal; border: none; color: white; font-size: 16px; padding: 12px; cursor: pointer; border-radius: 25px; margin: 20px auto 0; }
    #loginForm button:hover { background: #007770; }
    p { width: 100%; text-align: center; }
    .message { color: red; min-height: 20px; text-align: center; margin-top: 8px; }
    .contact { background: rgba(255,255,255,0.7); box-shadow: 0 0 12px #d0d0d0; border-radius: 8px; padding: 15px 10px; width: 100%; max-width: 340px; text-align: center; font-size: 16px; margin-top: 5px; overflow-wrap: anywhere; }
    .logo { height: 70px; position: absolute; right: 5%; top: 14px; }

    .pw-wrap { position: relative; }
    #loginForm .pw-wrap input { padding-right: 48px; }
    #loginForm .pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; min-width: 0; margin: 0; padding: 0; background: transparent; color: #444; border: none; border-radius: 50%; cursor: pointer; }
    #loginForm .pw-toggle:hover { background: rgba(0,0,0,0.08); }
    #loginForm .pw-toggle.on { color: teal; }

    .forgot { text-align: right; margin: 2px 6px 0; font-size: 14px; }
    .forgot a { color: #0b5ea8; font-weight: bold; text-decoration: none; }
    .forgot a:hover { text-decoration: underline; }

    .divider { display: flex; align-items: center; gap: 10px; color: #444; font-size: 14px; margin: 18px 0 4px; }
    .divider::before, .divider::after { content: ""; flex: 1; height: 1px; background: #999; }
    #loginForm button.google-btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; background: #fff; color: #333; border: 1px solid #bbb; margin: 12px 0 0; font-weight: bold; }
    #loginForm button.google-btn:hover { background: #f1f1f1; }

    @media (max-width: 600px) {
      body { justify-content: flex-start; padding-top: 90px; padding-bottom: 90px; }
      .logo { height: 48px; right: 12px; top: 12px; }
      #loginForm { padding: 22px 18px; }
      h2 { font-size: 26px; }
      .contact { font-size: 15px; }
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="LabTracker logo">
  <form id="loginForm">
    <h2>Login</h2>
    <input id="email" type="email" placeholder="Email" required autocomplete="email" />
    <div class="pw-wrap">
      <input id="password" type="password" placeholder="Password" required autocomplete="current-password" />
      <button type="button" id="togglePw" class="pw-toggle" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <div class="forgot"><a href="forgot-password.html">Forgot password?</a></div>
    <button type="submit">Login</button>

    <div class="divider">or</div>
    <button type="button" id="googleBtn" class="google-btn">
      <svg width="20" height="20" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.1H42V20H24v8h11.3C33.7 32.7 29.2 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 13 4 4 13 4 24s9 20 20 20 20-9 20-20c0-1.3-.1-2.6-.4-3.9z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.7 15.1 19 12 24 12c3.1 0 5.8 1.2 8 3l5.7-5.7C34 6.1 29.3 4 24 4 16.3 4 9.7 8.3 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 9.9-2 13.4-5.2l-6.2-5.2C29.2 35 26.7 36 24 36c-5.2 0-9.6-3.3-11.3-8l-6.5 5C9.5 39.6 16.2 44 24 44z"/><path fill="#1976D2" d="M43.6 20.1H42V20H24v8h11.3c-.8 2.2-2.2 4.2-4.1 5.6l6.2 5.2C37 39.2 44 34 44 24c0-1.3-.1-2.6-.4-3.9z"/></svg>
      Continue with Google
    </button>

    <div id="msg" class="message"></div>
    <p>New user? <a href="register.html">Register here</a></p>
  </form>

  <div class="contact">
    <strong>Contact Us:</strong><br>
    Phone: +91 9177843853<br>
    Email: hemanthkumarpinnu@gmail.com
  </div>

  <script>
    (function () {
      const pw = document.getElementById('password');
      const tg = document.getElementById('togglePw');
      const eye = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
      const eyeOff = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
      tg.addEventListener('click', () => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        tg.innerHTML = show ? eyeOff : eye;
        tg.classList.toggle('on', show);
        const label = show ? 'Hide password' : 'Show password';
        tg.setAttribute('aria-label', label); tg.title = label;
        pw.focus();
      });
    })();

    document.getElementById('loginForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim();
      const password = e.target.password.value.trim();
      const msg = document.getElementById('msg');
      msg.style.color = 'red';
      msg.textContent = 'Working...';

      try {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password });

        if (error) {
          msg.textContent = error.message;
          return;
        }

        window.location.href = 'dashboard.html';
      } catch (err) {
        msg.textContent = 'Unexpected error: ' + err.message;
      }
    };

    document.getElementById('googleBtn').addEventListener('click', async () => {
      const msg = document.getElementById('msg');
      msg.style.color = 'red';
      msg.textContent = 'Opening Google...';
      try {
        const { error } = await supabase.auth.signInWithOAuth({
          provider: 'google',
          options: { redirectTo: location.origin + '/dashboard.html' }
        });
        if (error) msg.textContent = error.message;
      } catch (e) {
        msg.textContent = 'Error: ' + e.message;
      }
    });
  </script>
  <script src="chatbot.js"></script>
</body>
</html>
