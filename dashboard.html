<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dashboard - LabTracker</title>
<script src="supabaseClient.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;min-height:100vh;background:url("cartoon-laboratory-room-with-flasks_23-2148899916.jpg") center/cover fixed;display:flex;flex-direction:column;align-items:center}
header{width:100%;background:rgba(255,255,255,.75);padding:10px 24px;box-shadow:0 2px 4px rgba(0,0,0,.1);display:flex;align-items:center;justify-content:space-between;gap:12px}
header h1{margin:0;font-size:32px;flex:1;text-align:center}
header img{height:60px}
main{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;padding:20px;text-align:center}
h2{color:#000;font-size:28px;margin:0 0 30px;word-break:break-all}
button.nav{width:350px;max-width:100%;margin:10px 0;padding:15px;font-size:18px;cursor:pointer;background:#32CD32;color:#fff;border:none;border-radius:5px}
button.nav:hover{background:#007770}
.contact{background:rgba(255,255,255,.85);padding:10px 18px;border-radius:8px;box-shadow:0 0 8px #b0b0b0;font-size:16px;margin:20px 0 90px}
.contact a{color:#0077ff;font-weight:bold;text-decoration:none}
.contact a:hover{text-decoration:underline}
@media (max-width:700px){
  header{flex-direction:column-reverse;padding:8px;gap:4px}
  header h1{font-size:18px}
  header img{height:40px}
  main{justify-content:flex-start;padding:24px 14px}
  h2{font-size:20px;margin-bottom:20px}
  button.nav{width:100%;padding:18px;font-size:17px;border-radius:12px}
  .contact{font-size:14px;width:100%;margin-bottom:90px}
}
.profile{background:#fff;color:#007770;font-weight:bold;text-decoration:none;padding:8px 14px;border-radius:20px;box-shadow:0 0 6px #999;white-space:nowrap}
.profile:hover{background:#e6fffd}
@media (max-width:700px){.profile{align-self:flex-end}}
</style>
</head>
<body>
<header>
  <header>
  <h1>Lab Tracker - An Inventory Management System</h1>
  <img src="logo.png" alt="logo">
  <a class="profile" href="profile.html">👤 Profile</a>
  </header>
</header>
<main>
  <h2>Welcome <span id="usernameDisplay"></span></h2>
  <button class="nav" onclick="location.href='addproduct.html'">Add Products</button>
  <button class="nav" onclick="location.href='products.html'">View Products</button>
  <button class="nav" onclick="logout()">Logout</button>
  <div class="contact">Contact: <a href="mailto:hemanthkumarpinnu@gmail.com">hemanthkumarpinnu@gmail.com</a></div>
</main>
<script>
(async () => {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { location.href = 'login.html'; return; }
  document.getElementById('usernameDisplay').textContent = user.email;
})();
async function logout() { await supabase.auth.signOut(); location.href = 'login.html'; }
</script>
<script src="chatbot.js"></script>
</body>
</html>
