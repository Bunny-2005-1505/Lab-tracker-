<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Forgot Password - LabTracker</title>
<script src="supabaseClient.js"></script>
<style>
* { box-sizing: border-box; }
body { font-family: Arial, sans-serif; margin: 0; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; background: #f0f2f5; background-image: url("chemistry-lab-illustrated-background_52683-68249.jpg"); background-size: cover; background-position: center; background-attachment: fixed; }
#box { background: rgba(255,255,255,0.8); padding: 30px; border-radius: 8px; box-shadow: 0 0 12px #fffcfc; width: 100%; max-width: 360px; }
h2 { text-align: center; font-size: 28px; margin: 0 0 10px; }
p.hint { font-size: 14px; color: #333; text-align: center; margin: 0 0 8px; }
input { width: 100%; margin: 10px 0; padding: 12px 14px; font-size: 16px; border-radius: 25px; border: 1px solid #bbb; }
button { display: block; width: 70%; min-width: 140px; background: teal; border: none; color: white; font-size: 16px; padding: 12px; cursor: pointer; border-radius: 25px; margin: 16px auto 0; }
button:disabled { opacity: .6; cursor: default; }
button:hover:not(:disabled) { background: #007770; }
.message { min-height: 20px; text-align: center; margin-top: 10px; font-size: 14px; }
p.links { text-align: center; margin: 14px 0 0; }
.logo { height: 70px; position: absolute; right: 5%; top: 14px; }
@media (max-width: 600px) { body { justify-content: flex-start; padding-top: 90px; } .logo { height: 48px; right: 12px; top: 12px; } #box { padding: 22px 18px; } }
</style>
</head>
<body>
<img class="logo" src="logo.png" alt="Lab Tracker logo">
<form id="box">
  <h2>Forgot password</h2>
  <p class="hint">Enter your account email. We will send you a link to set a new password.</p>
  <input id="email" type="email" placeholder="Email" required autocomplete="email">
  <button type="submit" id="go">Send reset link</button>
  <div id="msg" class="message"></div>
  <p class="links"><a href="login.html">Back to login</a></p>
</form>

<script>
const form = document.getElementById('box');
const msg = document.getElementById('msg');
const go = document.getElementById('go');
let wait = 0;

form.addEventListener('submit', async (e) => {
  e.preventDefault();
  const email = document.getElementById('email').value.trim();
  if (!email) return;
  go.disabled = true;
  msg.style.color = '#333';
  msg.textContent = 'Sending...';
  try {
    const { error } = await supabase.auth.resetPasswordForEmail(email, {
      redirectTo: location.origin + '/reset-password.html'
    });
    if (error && /rate|limit|seconds/i.test(error.message)) {
      msg.style.color = 'red';
      msg.textContent = 'Too many requests. Please wait a minute and try again.';
    } else {
      msg.style.color = 'green';
      msg.textContent = 'If an account exists for that email, a reset link has been sent. Check your inbox and spam folder.';
    }
  } catch (err) {
    msg.style.color = 'red';
    msg.textContent = 'Something went wrong. Please try again.';
  }
  wait = 60;
  const t = setInterval(() => {
    wait--;
    go.textContent = wait > 0 ? 'Send again in ' + wait + 's' : 'Send reset link';
    if (wait <= 0) { clearInterval(t); go.disabled = false; }
  }, 1000);
});
</script>
</body>
</html>
