<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Product - LabTracker</title>
<script src="supabaseClient.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;padding:20px;min-height:100vh;background:url("Addproduct.png") center/cover fixed}
.logo{position:absolute;top:10px;right:5%;height:60px}
h2{text-align:center;font-size:30px;margin:10px 0 20px}
form{width:50%;margin:0 auto;background:rgba(255,255,255,.85);padding:20px;border-radius:10px}
label{display:block;font-weight:bold;margin-top:10px}
input,textarea,select,button{width:100%;margin:6px 0;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:5px}
button{background:teal;color:#fff;border:none;cursor:pointer}
button:hover{background:#007770}
.back{width:50%;display:block;margin:15px auto}
#otherLabWrap{display:none}
#msg{color:red;text-align:center;margin-top:10px}

/* QR field + scanner */
.qr-row{display:flex;gap:8px;align-items:center}
.qr-row input{flex:1;min-width:0}
.scan-btn{width:auto;white-space:nowrap;padding:10px 16px}
#scanModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:50;align-items:center;justify-content:center;padding:16px}
.scan-box{background:#fff;border-radius:10px;padding:16px;width:100%;max-width:420px;max-height:95vh;overflow:auto}
#qrReader{width:100%}
#scanMsg{color:#c0392b;font-size:14px;min-height:18px;margin:6px 0}
.file-label{font-weight:normal;font-size:14px}
.cancel-btn{background:#7f8c8d}
.cancel-btn:hover{background:#6c7a7b}

/* ===== Mobile interface ===== */
@media (max-width:700px){
  body{padding:12px}
  .logo{height:40px;right:10px;top:8px}
  h2{font-size:22px;text-align:left;margin-top:44px}
  form{width:100%;padding:14px}
  .back{width:100%}
  input,textarea,select,button{font-size:16px;padding:12px}
}
</style>
</head>
<body>
<img class="logo" src="logo.png" alt="logo">
<h2>Add Product</h2>

<form id="addProductForm">
  <label>Lab
    <select id="labSelect">
      <option value="CSE Lab">CSE Lab</option>
      <option value="Physics Lab">Physics Lab</option>
      <option value="Chemistry Lab">Chemistry Lab</option>
      <option value="Other">Other (type lab name)</option>
    </select>
  </label>

  <div id="otherLabWrap">
    <label>Other Lab Name
      <input type="text" id="otherLab" placeholder="e.g. Biology Lab">
    </label>
  </div>

  <label for="qrCode">QR Code (scan or type manually)</label>
  <div class="qr-row">
    <input type="text" id="qrCode" placeholder="Enter code or scan">
    <button type="button" id="scanBtn" class="scan-btn">📷 Scan</button>
  </div>
  <label>Name<input type="text" id="name" required></label>
  <label>Description<textarea id="description"></textarea></label>
  <label>Quantity<input type="number" id="quantity" min="1" required></label>
  <label>Expiry Date<input type="date" id="expiryDate" required></label>
  <button type="submit">Add</button>
  <div id="msg"></div>
</form>

<button class="back" onclick="location.href='dashboard.html'">Back to Dashboard</button>

<!-- QR scanner popup -->
<div id="scanModal">
  <div class="scan-box">
    <h3 style="margin:0 0 8px">Scan QR Code</h3>
    <div id="qrReader"></div>
    <div id="scanMsg"></div>
    <label class="file-label">Or pick a photo of the QR code
      <input type="file" id="qrFile" accept="image/*">
    </label>
    <button type="button" id="closeScan" class="cancel-btn">Cancel</button>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let currentUser = null;

(async () => {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { location.href = 'login.html'; return; }
  currentUser = user;
})();

// Show the text box only when "Other" is selected
const labSelect = document.getElementById('labSelect');
const otherWrap = document.getElementById('otherLabWrap');
labSelect.addEventListener('change', () => {
  const isOther = labSelect.value === 'Other';
  otherWrap.style.display = isOther ? 'block' : 'none';
  document.getElementById('otherLab').required = isOther;
});

// ---- QR scanner ----
const scanModal = document.getElementById('scanModal');
const scanMsg = document.getElementById('scanMsg');
let scanner = null;

function onScanned(text) {
  document.getElementById('qrCode').value = text.trim();
  closeScanner();
}

async function closeScanner() {
  scanModal.style.display = 'none';
  if (scanner) {
    try { if (scanner.isScanning) await scanner.stop(); } catch (e) {}
    try { scanner.clear(); } catch (e) {}
    scanner = null;
  }
}

document.getElementById('scanBtn').addEventListener('click', async () => {
  scanMsg.textContent = '';
  scanModal.style.display = 'flex';
  if (typeof Html5Qrcode === 'undefined') {
    scanMsg.textContent = 'Scanner could not load. Check your internet connection, or type the code manually.';
    return;
  }
  try {
    scanner = new Html5Qrcode('qrReader');
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      onScanned,
      () => {}
    );
  } catch (err) {
    scanMsg.textContent = 'Could not open the camera. Allow camera permission, use a photo below, or type the code manually.';
  }
});

document.getElementById('closeScan').addEventListener('click', closeScanner);

document.getElementById('qrFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  scanMsg.textContent = '';
  try {
    if (scanner && scanner.isScanning) await scanner.stop();
    const reader = scanner || new Html5Qrcode('qrReader');
    scanner = reader;
    const text = await reader.scanFile(file, false);
    onScanned(text);
  } catch (err) {
    scanMsg.textContent = 'No QR code found in that photo. Try a clearer one or type the code manually.';
  }
  e.target.value = '';
});

document.getElementById('addProductForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('msg');

  let lab = labSelect.value;
  if (lab === 'Other') lab = document.getElementById('otherLab').value.trim();

  const qrCode = document.getElementById('qrCode').value.trim();
  const name = document.getElementById('name').value.trim();
  const description = document.getElementById('description').value.trim();
  const quantity = parseInt(document.getElementById('quantity').value);
  const expiryDate = document.getElementById('expiryDate').value;

  if (!lab || !name || !(quantity > 0) || !expiryDate) {
    msgEl.textContent = 'Please fill all required fields';
    return;
  }

  const { error } = await supabase.from('products').insert({
    user_id: currentUser.id,
    lab,
    qr_code: qrCode,
    name,
    description,
    quantity,
    expiry_date: expiryDate
  });

  if (error) { msgEl.textContent = error.message; return; }

  msgEl.textContent = '';
  alert('Product added successfully!');

  const diffDays = Math.floor((new Date(expiryDate) - new Date()) / 86400000);
  if (diffDays >= 0 && diffDays <= 7) {
    alert(`Alert: Product "${name}" in ${lab} is expiring in ${diffDays} days!`);
  }

  e.target.reset();
  otherWrap.style.display = 'none';
});
</script>
<script src="mfa-guard.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
