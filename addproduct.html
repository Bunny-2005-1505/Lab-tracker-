<!DOCTYPE html>
<html lang="en">
<head>
<meta name="robots" content="noindex, nofollow">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Product - LabTracker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="ui.css">
<style>
.formcard{max-width:600px;padding:6px 24px 24px}
.qr-row{display:flex;gap:8px}.qr-row input{flex:1;min-width:0}.qr-row .btn{margin-top:6px}
#msg{color:var(--red);font-size:14px;min-height:20px;margin-top:10px}
#scanMsg{color:var(--red);font-size:14px;min-height:18px;margin:6px 0}
</style>
<script src="supabaseClient.js"></script>
</head>
<body data-page="products">
<main class="page">
  <div class="m-top"><img src="logo.png" alt="">Lab Tracker</div>
  <header class="head"><div><h1>Add product</h1><p>Scan a code or type the details.</p></div><a class="btn" href="products.html">Back to stock</a></header>
  <form id="addProductForm" class="card formcard">
    <label>Lab
      <select id="labSelect"><option value="CSE Lab">CSE Lab</option><option value="Physics Lab">Physics Lab</option><option value="Chemistry Lab">Chemistry Lab</option><option value="Other">Other (type lab name)</option></select>
    </label>
    <div id="otherLabWrap" hidden><label>Lab name<input type="text" id="otherLab" placeholder="e.g. Biology Lab"></label></div>
    <label for="qrCode">Code (scan or type)</label>
    <div class="qr-row"><input type="text" id="qrCode" placeholder="Enter code or scan"><button type="button" id="scanBtn" class="btn">Scan</button></div>
    <label>Name<input type="text" id="name" required></label>
    <label>Description<textarea id="description" rows="2"></textarea></label>
    <div class="f2"><label>Quantity<input type="number" id="quantity" min="1" required></label><label>Unit<input type="text" id="unit" placeholder="bottles, packs, pieces"></label></div>
    <div class="f2"><label>Reorder at<input type="number" id="lowStock" min="0" placeholder="0"><span class="hint">Warn me when stock drops to this</span></label><label>Expiry date<input type="date" id="expiryDate" required></label></div>
    <div id="msg" role="alert"></div>
    <button class="btn pri" style="width:100%;margin-top:8px">Add product</button>
  </form>
</main>

<div class="ov" id="scanModal"><div class="modal">
  <h3>Scan QR code</h3>
  <div id="qrReader" style="margin-top:10px"></div>
  <div id="scanMsg"></div>
  <label>Or pick a photo of the code<input type="file" id="qrFile" accept="image/*"></label>
  <div class="mact"><button type="button" id="closeScan" class="btn">Cancel</button></div>
</div></div>

<script src="nav.js"></script>
<script src="https://cdn.jsdelivr.net/npm/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<script>
let currentUser = null;

(async () => {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { location.href = 'login.html'; return; }
  currentUser = user;
})();
const labSelect = document.getElementById('labSelect');
const otherWrap = document.getElementById('otherLabWrap');
labSelect.addEventListener('change', () => {
  const isOther = labSelect.value === 'Other';
  otherWrap.hidden = !isOther;
  document.getElementById('otherLab').required = isOther;
});

const scanModal = document.getElementById('scanModal');
const scanMsg = document.getElementById('scanMsg');
let scanner = null;

function onScanned(text) {
  document.getElementById('qrCode').value = text.trim();
  closeScanner();
}

async function closeScanner() {
  scanModal.classList.remove('show');
  if (scanner) {
    try { if (scanner.isScanning) await scanner.stop(); } catch (e) {}
    try { scanner.clear(); } catch (e) {}
    scanner = null;
  }
}

document.getElementById('scanBtn').addEventListener('click', async () => {
  scanMsg.textContent = '';
  scanModal.classList.add('show');
  if (typeof Html5Qrcode === 'undefined') {
    scanMsg.textContent = 'Scanner could not load. Check your internet connection, or type the code manually.';
    return;
  }
  try {
    scanner = new Html5Qrcode('qrReader');
    await scanner.start(
      { facingMode: 'environment' },
      { fps: 10, qrbox: { width: 220, height: 220 } },
      onScanned,
      () => {}
    );
  } catch (err) {
    scanMsg.textContent = 'Could not open the camera. Allow camera permission, use a photo below, or type the code manually.';
  }
});

document.getElementById('closeScan').addEventListener('click', closeScanner);

document.getElementById('qrFile').addEventListener('change', async (e) => {
  const file = e.target.files[0];
  if (!file) return;
  scanMsg.textContent = '';
  try {
    if (scanner && scanner.isScanning) await scanner.stop();
    const reader = scanner || new Html5Qrcode('qrReader');
    scanner = reader;
    const text = await reader.scanFile(file, false);
    onScanned(text);
  } catch (err) {
    scanMsg.textContent = 'No QR code found in that photo. Try a clearer one or type the code manually.';
  }
  e.target.value = '';
});

document.getElementById('addProductForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('msg');

  let lab = labSelect.value;
  if (lab === 'Other') lab = document.getElementById('otherLab').value.trim();

  const qrCode = document.getElementById('qrCode').value.trim();
  const name = document.getElementById('name').value.trim();
  const description = document.getElementById('description').value.trim();
  const quantity = parseInt(document.getElementById('quantity').value);
  const unit = document.getElementById('unit').value.trim() || 'units';
  const lowStock = parseInt(document.getElementById('lowStock').value) || 0;
  const expiryDate = document.getElementById('expiryDate').value;

  if (!lab || !name || !(quantity > 0) || !expiryDate) {
    msgEl.textContent = 'Please fill all required fields';
    return;
  }

  const row = { user_id: currentUser.id, lab, qr_code: qrCode, name, description, quantity, expiry_date: expiryDate };
  let { error } = await supabase.from('products').insert({ ...row, unit, low_stock_level: lowStock });
  if (error && /unit|low_stock_level/.test(error.message)) ({ error } = await supabase.from('products').insert(row)); // migration not applied yet
  if (error) { msgEl.textContent = error.message; return; }

  msgEl.textContent = '';
  const diffDays = Math.floor((new Date(expiryDate) - new Date()) / 86400000);
  toast(diffDays >= 0 && diffDays <= 7 ? `Added. "${name}" expires in ${diffDays} days` : 'Product added');

  e.target.reset();
  otherWrap.hidden = true;
});
</script>
<script src="mfa-guard.js"></script>
<script src="chatbot.js"></script>
</body>
</html>
