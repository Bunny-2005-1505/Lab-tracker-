<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Add Product - LabTracker</title>
<script src="supabaseClient.js"></script>
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;margin:0;padding:20px;min-height:100vh;background:url("download__1_.jpg") center/cover fixed}
.logo{position:absolute;top:10px;right:5%;height:60px}
h2{text-align:center;font-size:30px;margin:10px 0 20px}
form{width:50%;margin:0 auto;background:rgba(255,255,255,.85);padding:20px;border-radius:10px}
label{display:block;font-weight:bold;margin-top:10px}
input,textarea,select,button{width:100%;margin:6px 0;padding:10px;font-size:16px;border:1px solid #bbb;border-radius:5px}
button{background:teal;color:#fff;border:none;cursor:pointer}
button:hover{background:#007770}
.back{width:50%;display:block;margin:15px auto}
#otherLabWrap{display:none}
#msg{color:red;text-align:center;margin-top:10px}

/* ===== Mobile interface ===== */
@media (max-width:700px){
  body{padding:12px}
  .logo{height:40px;right:10px;top:8px}
  h2{font-size:22px;text-align:left;margin-top:44px}
  form{width:100%;padding:14px}
  .back{width:100%}
  input,textarea,select,button{font-size:16px;padding:12px}
}
</style>
</head>
<body>
<img class="logo" src="logo.png" alt="logo">
<h2>Add Product</h2>

<form id="addProductForm">
  <label>Lab
    <select id="labSelect">
      <option value="CSE Lab">CSE Lab</option>
      <option value="Physics Lab">Physics Lab</option>
      <option value="Chemistry Lab">Chemistry Lab</option>
      <option value="Other">Other (type lab name)</option>
    </select>
  </label>

  <div id="otherLabWrap">
    <label>Other Lab Name
      <input type="text" id="otherLab" placeholder="e.g. Biology Lab">
    </label>
  </div>

  <label>QR Code<input type="text" id="qrCode" placeholder="Enter code"></label>
  <label>Name<input type="text" id="name" required></label>
  <label>Description<textarea id="description"></textarea></label>
  <label>Quantity<input type="number" id="quantity" min="1" required></label>
  <label>Expiry Date<input type="date" id="expiryDate" required></label>
  <button type="submit">Add</button>
  <div id="msg"></div>
</form>

<button class="back" onclick="location.href='dashboard.html'">Back to Dashboard</button>

<script>
let currentUser = null;

(async () => {
  const { data: { user } } = await supabase.auth.getUser();
  if (!user) { location.href = 'login.html'; return; }
  currentUser = user;
})();

// Show the text box only when "Other" is selected
const labSelect = document.getElementById('labSelect');
const otherWrap = document.getElementById('otherLabWrap');
labSelect.addEventListener('change', () => {
  const isOther = labSelect.value === 'Other';
  otherWrap.style.display = isOther ? 'block' : 'none';
  document.getElementById('otherLab').required = isOther;
});

document.getElementById('addProductForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const msgEl = document.getElementById('msg');

  let lab = labSelect.value;
  if (lab === 'Other') lab = document.getElementById('otherLab').value.trim();

  const qrCode = document.getElementById('qrCode').value.trim();
  const name = document.getElementById('name').value.trim();
  const description = document.getElementById('description').value.trim();
  const quantity = parseInt(document.getElementById('quantity').value);
  const expiryDate = document.getElementById('expiryDate').value;

  if (!lab || !name || !(quantity > 0) || !expiryDate) {
    msgEl.textContent = 'Please fill all required fields';
    return;
  }

  const { error } = await supabase.from('products').insert({
    user_id: currentUser.id,
    lab,
    qr_code: qrCode,
    name,
    description,
    quantity,
    expiry_date: expiryDate
  });

  if (error) { msgEl.textContent = error.message; return; }

  msgEl.textContent = '';
  alert('Product added successfully!');

  const diffDays = Math.floor((new Date(expiryDate) - new Date()) / 86400000);
  if (diffDays >= 0 && diffDays <= 7) {
    alert(`Alert: Product "${name}" in ${lab} is expiring in ${diffDays} days!`);
  }

  e.target.reset();
  otherWrap.style.display = 'none';
});
</script>
<script src="chatbot.js"></script>
</body>
</html>
