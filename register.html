<!DOCTYPE html>
<html>
<head>
  <title>Register - LabTracker</title>
  <style>
    body { font-family: Arial; display: flex; justify-content: center; align-items: center; height: 100vh; background: #f0f2f5; background-image: url("chemistry-lab-illustrated-background_52683-68249.jpg"); background-size: cover; }
    form { background: rgba(255, 255, 255, 0.448); padding: 30px; border-radius: 8px; box-shadow: 0 0 12px #fffcfc; width: 300px; }
    h2{width: 100%; text-align: center;font-size:30px}
    input { width: 100%; margin: 10px 0; padding: 10px;border-radius: 25px; }
    button { width: 50%; background: teal; border: none; color: white; font-size: 16px; padding: 10px; cursor: pointer;border-radius: 25px;margin-left: 25%;margin-top: 10%; }
    button:hover { background: #007770; }
    p{width: 100%;; text-align: center; }
    .message { color: red; height: 20px; }
    img{
    height: 70px;
    margin-right: 5%;
    vertical-align: middle;
    position: absolute;
    right: 0%;
    top: 5%;
  }
  </style>
</head>
<body>
  <img src="logo.png" alt="">
  <form id="registerForm">
    <h2>Register</h2>
    <input id="username" placeholder="Username" required />
    <input id="password" type="password" placeholder="Password" required />
    <button type="submit">Register</button>
    <div id="msg" class="message"></div>
    <p>Already registered? <a href="login.html">Login here</a></p>
  </form>

  <script>
    document.getElementById('registerForm').onsubmit = e => {
      e.preventDefault();
      const username = e.target.username.value.trim();
      const password = e.target.password.value.trim();

      const users = JSON.parse(localStorage.getItem('users') || '[]');
      if (users.some(u => u.username === username)) {
        document.getElementById('msg').textContent = 'Username taken';
        return;
      }
      users.push({username, password});
      localStorage.setItem('users', JSON.stringify(users));
      alert('Registration successful! Please login.');
      window.location.href = 'login.html';
    };
  </script>
</body>
</html>
