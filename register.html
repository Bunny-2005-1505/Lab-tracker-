<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Register - LabTracker</title>
  <script src="supabaseClient.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { font-family: Arial, sans-serif; margin: 0; padding: 16px; min-height: 100vh; display: flex; justify-content: center; align-items: center; flex-direction: column; background: #f0f2f5; background-image: url("chemistry-lab-illustrated-background_52683-68249.jpg"); background-size: cover; background-position: center; background-attachment: fixed; }
    #registerForm { background: rgba(255, 255, 255, 0.55); padding: 30px; border-radius: 8px; box-shadow: 0 0 12px #fffcfc; width: 100%; max-width: 340px; margin-bottom: 15px; }
    h2 { width: 100%; text-align: center; font-size: 30px; margin: 0 0 10px; }
    #registerForm input { width: 100%; margin: 10px 0; padding: 12px 14px; font-size: 16px; border-radius: 25px; border: 1px solid #bbb; }
    #registerForm button { display: block; width: 50%; min-width: 120px; background: teal; border: none; color: white; font-size: 16px; padding: 12px; cursor: pointer; border-radius: 25px; margin: 20px auto 0; }
    #registerForm button:hover { background: #007770; }
    p { width: 100%; text-align: center; }
    .message { color: red; min-height: 20px; text-align: center; margin-top: 8px; }
    .contact-unused { background: rgba(255,255,255,0.7); box-shadow: 0 0 12px #d0d0d0; border-radius: 8px; padding: 15px 10px; width: 100%; max-width: 340px; text-align: center; font-size: 16px; margin-top: 5px; overflow-wrap: anywhere; }
    .logo { height: 70px; position: absolute; right: 5%; top: 14px; }

    .pw-wrap { position: relative; }
    #registerForm .pw-wrap input { padding-right: 48px; }
    #registerForm .pw-toggle { position: absolute; right: 6px; top: 50%; transform: translateY(-50%); display: flex; align-items: center; justify-content: center; width: 38px; height: 38px; min-width: 0; margin: 0; padding: 0; background: transparent; color: #444; border: none; border-radius: 50%; cursor: pointer; }
    #registerForm .pw-toggle:hover { background: rgba(0,0,0,0.08); }
    #registerForm .pw-toggle.on { color: teal; }

    @media (max-width: 600px) {
      body { justify-content: flex-start; padding-top: 90px; padding-bottom: 90px; }
      .logo { height: 48px; right: 12px; top: 12px; }
      #registerForm { padding: 22px 18px; }
      h2 { font-size: 26px; }
      .contact-unused { font-size: 15px; }
    }
  </style>
</head>
<body>
  <img class="logo" src="logo.png" alt="LabTracker logo">
  <form id="registerForm">
    <h2>Register</h2>
    <input id="email" type="email" placeholder="Email" required />
    <div class="pw-wrap">
      <input id="password" type="password" placeholder="Password (min 6 characters)" required />
      <button type="button" id="togglePw" class="pw-toggle" aria-label="Show password" title="Show password"><svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg></button>
    </div>
    <button type="submit">Register</button>
    <div id="msg" class="message"></div>
    <p>Already registered? <a href="login.html">Login here</a></p>
  </form>

  <script>
    // Show / hide password
    (function () {
      const pw = document.getElementById('password');
      const tg = document.getElementById('togglePw');
      const eye = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M1 12s4-7 11-7 11 7 11 7-4 7-11 7S1 12 1 12z"/><circle cx="12" cy="12" r="3"/></svg>';
      const eyeOff = '<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17.94 17.94A10.94 10.94 0 0 1 12 19c-7 0-11-7-11-7a19.8 19.8 0 0 1 5.06-5.94"/><path d="M9.9 4.24A10.9 10.9 0 0 1 12 5c7 0 11 7 11 7a19.9 19.9 0 0 1-3.17 4.19"/><path d="M14.12 14.12A3 3 0 1 1 9.88 9.88"/><line x1="1" y1="1" x2="23" y2="23"/></svg>';
      tg.addEventListener('click', () => {
        const show = pw.type === 'password';
        pw.type = show ? 'text' : 'password';
        tg.innerHTML = show ? eyeOff : eye;
        tg.classList.toggle('on', show);
        const label = show ? 'Hide password' : 'Show password';
        tg.setAttribute('aria-label', label); tg.title = label;
        pw.focus();
      });
    })();
    document.getElementById('registerForm').onsubmit = async (e) => {
      e.preventDefault();
      const email = e.target.email.value.trim();
      const password = e.target.password.value.trim();
      const msg = document.getElementById('msg');
      msg.style.color = 'red';
      msg.textContent = 'Working...';

      try {
        const { data, error } = await supabase.auth.signUp({ email, password });

        if (error) {
          msg.textContent = error.message;
          return;
        }

        msg.style.color = 'green';
        msg.textContent = 'Registration successful! Check your email to confirm, then login.';
        setTimeout(() => window.location.href = 'login.html', 2500);
      } catch (err) {
        msg.textContent = 'Unexpected error: ' + err.message;
      }
    };
  </script>
  <script src="chatbot.js"></script>
</body>
</html>
